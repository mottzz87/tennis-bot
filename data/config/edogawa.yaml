# ===== 平台开关 =====
enabled: true          # 平台是否启用

# ===== 空位过滤（扫描出的空位满足这些条件才推送）=====
TARGET_PLACE:          # 要扫描的场地
  - 谷河内テニスコート
  - 西葛西テニスコート
TIME_FILTER:           # 只推送时段匹配的时间区间；空 = 全部
  - 6-11
  - 17-22
WEEKDAY_FILTER: []     # 只推送星期匹配的日期；空 = 全部
COURT_NUM_FILTER: []   # 只推送指定场地编号的球场；空 = 全部
GOLDEN_TIME_FILTER:    # 黄金时段（扫描时优先合并这些时段）
  - 19-21

# ===== 自动预约（配合 global.AUTO_BOOK: true 使用）=====
AUTO_TIME_FILTER: []      # 自动预约只约该时间区间
AUTO_WEEKDAY_FILTER: []   # 自动预约只约这些星期
AUTO_PLACE_FILTER: []     # 自动预约只约这些场地
AUTO_COURT_NUM_FILTER: [] # 自动预约只约指定场地编号的球场
AUTO_COURT_GROUP: []      # 自动预约只约这些场地组（如 ["硬地"]）

# ===== 场地展示与代码别名（priority 越小越优先自动约）=====
PLACE_MAP:
  松江テニスコート:
    short: 松江
    emoji: ⛳
    courtCode: matsue
    bike: 🚴 40分
    priority: 6
  西葛西テニスコート:
    short: 西葛西
    emoji: 🎯
    courtCode: nishikasai
    bike: 🚇 45分
    priority: 3
  小岩テニスコート:
    short: 小岩
    emoji: 🚩
    courtCode: koiwa
    bike: 🚴 35分
    priority: 5
  谷河内テニスコート:
    short: 谷河内
    emoji: 🏆
    courtCode: yagouchi
    bike: 🚴 25分
    priority: 1
  スポーツランド:
    short: 江户川
    emoji: 🏟️
    courtCode: sportsland
    bike: 🚴 20分
    priority: 4
  水辺のスポーツガーデン:
    short: 水辺
    emoji: 🏸
    courtCode: mizube
    bike: 🚴 20分
    priority: 2

# ===== 场地分组（跨面拼接/时段合并时按组处理）=====
COURT_GROUPS:
  西葛西テニスコート:
    - group: 硬地
      letters:
        - A
        - B
    - group: 人工芝
      default: true

# ===== 扫描 =====
SCAN_DAYS: 30            # 一次扫描的日期窗口（天）
MIN_CONTINUOUS_HOURS: 2  # 相邻时段合并成连续段的最短小时数
SEARCH_MODE: hour        # 扫描/合并模式（按小时）
INTERVAL: 230            # 本平台扫描间隔（秒），覆盖 global.INTERVAL

# ===== 预约 =====
BOOK_DURATION: 60          # 预约时长（分钟）
BOOK_PURPOSE: テニス（硬・軟式）  # 申请明细里的用途 radio 文案
BOOK_PEOPLE: 6             # 利用人数
BOOK_EVENT_NAME: テニス練習      # 催し物名

# ===== 可覆盖的全局字段（取消注释即可覆盖 global.yaml 的默认值）=====
# HUMAN_DELAY_MIN: 150        # 人类操作停顿下限（毫秒）
# HUMAN_DELAY_MAX: 450        # 人类操作停顿上限（毫秒）
# HUMAN_INPUT_EXTRA_MS: 400   # 输入框操作后额外叠加的停顿（毫秒）
# DOUBLE_CONFIRM_DAYS: 7      # 距开始 N 天内时段二次确认（本网站才能约 7 天内时段；设 0 关闭）
